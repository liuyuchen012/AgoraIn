name: v4 build

# ═══════════════════════════════════════════════════════════════════════
# AgoraIn v4.0 自动构建
#
# 触发策略（仓库已公开 → Actions 分钟与产物存储免费）：
#   · push / PR → 门禁 + Web 面板 + 桌面端 ×5 + 服务端 ×3 + 移动端 ×2（全平台）
#   · 构建成功后自动发布版本：
#       - push 到分支 → 打 tag `v4.0.0-build.{运行号}`，发布**预发布版本**
#       - 手动打 tag  → 使用该 tag 发布**正式版本**
#   · 产物保留 7 天，过期清理见 .github/workflows/cleanup-artifacts.yml
# 说明：自包含包体积较大（桌面端约 112MB 解压 / 约 50MB zip）。
#
# 产物（tag / 手动触发）：
#   · 桌面端  AgoraIn-{win-x64,linux-x64,linux-arm64,osx-x64,osx-arm64}.zip
#   · 服务端  AgoraIn-Server-{win-x64,linux-x64,osx-arm64}.zip（内置 Web 管理面板）
#   · 移动端  AgoraIn-Android.apk/.aab；AgoraIn-iOS-simulator.zip（免签名）
#
# 签名：iOS / macOS 产物默认不签名，仅供内部测试；正式分发需配置证书。
# ═══════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [v4.0]
    tags: ['v4*']
    paths:
      - 'v4/**'
      - '.github/workflows/v4-build.yml'
  pull_request:
    paths: ['v4/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ══════════════════════════════════════════════════════════════════
  # 1. 质量门禁：构建 + 单元测试（每次 push / PR 都跑）
  # ══════════════════════════════════════════════════════════════════
  test:
    name: 质量门禁（build + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      - name: 还原
        run: dotnet restore v4/AgoraIn.sln

      - name: 构建（Debug，零警告要求）
        run: dotnet build v4/AgoraIn.sln -c Debug --no-restore

      - name: 单元测试
        run: dotnet test v4/AgoraIn.sln --no-build -c Debug

      # 仅在失败时留证，保留 1 天，避免占用产物配额
      - name: 保存测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-failure-${{ github.run_number }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # 2. Web 管理面板（Vue 3 → 静态产物）
  #    产物仅用于传递给服务端作业（体积很小，约 1MB）
  # ══════════════════════════════════════════════════════════════════
  webadmin:
    name: Web 管理面板
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4/src/AgoraIn.WebAdmin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v4/src/AgoraIn.WebAdmin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（含 vue-tsc 类型检查）
        run: npm run build

      # 交给服务端作业打包进 wwwroot（体积约 1MB）
      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: webadmin-dist
          path: v4/src/AgoraIn.WebAdmin/dist
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════
  # 3. 桌面端（Avalonia）：Windows / Linux / macOS —— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  desktop:
    name: 桌面端 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-latest, rid: win-x64 }
          - { name: linux-x64,   os: ubuntu-latest,  rid: linux-x64 }
          - { name: linux-arm64, os: ubuntu-latest,  rid: linux-arm64 }
          - { name: osx-x64,     os: macos-latest,   rid: osx-x64 }
          - { name: osx-arm64,   os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      # 自包含发布；关闭符号文件可显著减小体积（省产物配额）
      - name: 发布（自包含，不含调试符号）
        shell: bash
        run: |
          dotnet publish v4/src/AgoraIn.App/AgoraIn.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishReadyToRun=false \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/desktop

      # 冒烟自测：验证发布产物可运行
      # 注意：AgoraIn 是 GUI 子系统（WinExe）程序，PowerShell 用 `& exe` 调用**不会等待**、
      # $LASTEXITCODE 为空，必须用 Start-Process -Wait -PassThru 取真实退出码。
      # 另外校验报告内容作为第二道保险（防止退出码未正确传递）。
      - name: 冒烟自测
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = "publish/selftest-report.txt"
          $p = Start-Process -FilePath "publish/desktop/AgoraIn.exe" `
               -ArgumentList "--selftest", "--out", $report `
               -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report } else { throw "自测报告未生成" }
          if ($p.ExitCode -ne 0) { throw "自测失败（退出码 $($p.ExitCode)）" }
          if (-not (Select-String -Path $report -Pattern "selftest OK" -Quiet)) {
            throw "自测报告未包含通过标记 selftest OK"
          }

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/desktop/* -DestinationPath publish/AgoraIn-${{ matrix.name }}.zip

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/desktop/AgoraIn
          (cd publish && zip -r -q "AgoraIn-${{ matrix.name }}.zip" desktop)

      - name: 上传产物（保留 7 天）
        uses: actions/upload-artifact@v5
        with:
          name: AgoraIn-${{ matrix.name }}
          path: publish/AgoraIn-${{ matrix.name }}.zip
          retention-days: 7


  # ══════════════════════════════════════════════════════════════════
  # 4. 服务端（ASP.NET Core，内置 Web 管理面板）—— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  server:
    name: 服务端 ${{ matrix.name }}
    needs: [test, webadmin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,   os: windows-latest, rid: win-x64 }
          - { name: linux-x64, os: ubuntu-latest,  rid: linux-x64 }
          - { name: osx-arm64, os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      # 把 Web 管理面板产物放进 wwwroot，随服务端一起分发
      - name: 下载 Web 管理面板
        uses: actions/download-artifact@v5
        with:
          name: webadmin-dist
          path: v4/src/AgoraIn.Server/wwwroot

      - name: 发布（自包含，不含调试符号）
        shell: bash
        run: |
          dotnet publish v4/src/AgoraIn.Server/AgoraIn.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishReadyToRun=false \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/server

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/server/* -DestinationPath publish/AgoraIn-Server-${{ matrix.name }}.zip

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/server/AgoraIn.Server
          (cd publish && zip -r -q "AgoraIn-Server-${{ matrix.name }}.zip" server)

      - name: 上传产物（保留 7 天）
        uses: actions/upload-artifact@v5
        with:
          name: AgoraIn-Server-${{ matrix.name }}
          path: publish/AgoraIn-Server-${{ matrix.name }}.zip
          retention-days: 7


  # ══════════════════════════════════════════════════════════════════
  # 5. 移动端 Android（MAUI）—— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  android:
    name: 移动端 Android
    needs: test
    runs-on: ubuntu-latest
    # 正式签名证书（*.keystore）已 gitignore：公开仓库不能放签名私钥，故 CI 上没有。
    # 配置下面两个 Secrets 后，CI 会用正式证书签名（与 App 备案的签名一致）；
    # 未配置时 csproj 的条件不成立 → 回退 SDK 调试证书，产物仅供测试安装。
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 MAUI Android 工作负载
        run: dotnet workload install maui-android

      # step 级 if 读不到 secrets，故通过 job 级 env 中转
      - name: 写入正式签名证书（配置了 Secrets 时）
        if: env.KEYSTORE_B64 != ''
        shell: bash
        run: |
          mkdir -p v4/src/AgoraIn.Mobile/signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > v4/src/AgoraIn.Mobile/signing/agorain-release.keystore
          ls -l v4/src/AgoraIn.Mobile/signing/agorain-release.keystore

      # MAUI 多目标项目必须按「单一 TFM + 单一 RID」单独还原，
      # 否则 assets 文件缺少 net10.0-android/android-* 目标而报 NETSDK1047
      - name: 还原（仅 Android / android-arm64）
        run: |
          dotnet restore v4/src/AgoraIn.Mobile/AgoraIn.Mobile.csproj \
            -p:TargetFrameworks=net10.0-android \
            -p:RuntimeIdentifier=android-arm64

      - name: 发布 APK
        run: |
          dotnet publish v4/src/AgoraIn.Mobile/AgoraIn.Mobile.csproj \
            -f net10.0-android -c Release -r android-arm64 --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSigningStorePassword="$KEYSTORE_PASS" \
            -p:AndroidSigningKeyPassword="$KEYSTORE_PASS" \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/android

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p publish/artifacts
          find publish/android -name "*.apk" -exec cp {} publish/artifacts/AgoraIn-Android.apk \;
          find publish/android -name "*.aab" -exec cp {} publish/artifacts/AgoraIn-Android.aab \;
          ls -lh publish/artifacts || true

      - name: 上传产物（保留 7 天）
        uses: actions/upload-artifact@v5
        with:
          name: AgoraIn-Android
          path: publish/artifacts/*
          if-no-files-found: warn
          retention-days: 7


  # ══════════════════════════════════════════════════════════════════
  # 6. 自动发布版本（全部平台构建成功后）
  #    · push 构建 → 自动打 tag `v4.0.0-build.{运行号}` 并发布（预发布）
  #    · 手动打 tag → 发布正式版（非预发布），使用该 tag
  # ══════════════════════════════════════════════════════════════════
  release:
    name: 发布版本
    needs: [desktop, server, android]
    # 仅 push 事件（含 tag）；桌面端与服务端必须成功，移动端失败不阻塞发布。
    # 守卫：排除自动生成的构建 tag，防止「发布 → 建 tag → 再触发构建 → 再发布」循环。
    # （默认 GITHUB_TOKEN 创建的事件本就不会触发新运行；此守卫是为将来换 PAT 时仍安全。）
    if: >-
      github.event_name == 'push' && !cancelled()
      && !startsWith(github.ref_name, 'v4.0.0-build.')
      && needs.desktop.result == 'success'
      && needs.server.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
          pattern: AgoraIn-*

      - name: 过滤出发布文件（zip / apk / aab）
        run: |
          find assets -type f ! \( -name "*.zip" -o -name "*.apk" -o -name "*.aab" \) -delete
          echo "=== 待发布文件 ==="
          ls -lh assets/

      - name: 计算版本号
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "发布正式版：${TAG}"
          else
            TAG="v4.0.0-build.${GITHUB_RUN_NUMBER}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "发布预发布版本：${TAG}"
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            AgoraIn v4.0 自动构建（提交 ${{ github.sha }}）

            | 平台 | 文件 |
            | --- | --- |
            | Windows 桌面端 | `AgoraIn-win-x64.zip`（解压后运行 AgoraIn.exe） |
            | Linux 桌面端 | `AgoraIn-linux-x64.zip` / `AgoraIn-linux-arm64.zip` |
            | macOS 桌面端 | `AgoraIn-osx-x64.zip` / `AgoraIn-osx-arm64.zip` |
            | Windows 服务端 | `AgoraIn-Server-win-x64.zip`（内置 Web 管理面板） |
            | Linux 服务端 | `AgoraIn-Server-linux-x64.zip` |
            | macOS 服务端 | `AgoraIn-Server-osx-arm64.zip` |
            | Android | `AgoraIn-Android.apk`（配置了签名 Secrets 时为正式签名，否则为调试签名，仅供测试） |
            | iOS | `AgoraIn-iOS-simulator.zip`（仅模拟器，真机需签名） |

            > 客户端统一连接 `https://agorain.615mc.cn`（服务器地址已锁定，不可配置）。
