name: v4 build

# ═══════════════════════════════════════════════════════════════════════
# AgoraIn v4.0 自动构建
#
# ⚠️ 产物配额策略（私有仓库 Actions 产物存储仅 500MB）
#   自包含发布包很大（桌面端约 60MB/平台 × 5 + 服务端 3 + 移动端 2），
#   每次 push 都上传会瞬间打满配额。因此：
#     · push / PR      → 只跑门禁（构建 + 测试），**不产生产物**（零配额占用）
#     · tag / 手动触发 → 完整构建 + 上传产物（保留 3 天）+ 附到 GitHub Release
#   正式分发请用 Release 附件（Release 资源不计入 Actions 产物配额）。
#
# 产物（tag / 手动触发）：
#   · 桌面端  AgoraIn-{win-x64,linux-x64,linux-arm64,osx-x64,osx-arm64}.zip
#   · 服务端  AgoraIn-Server-{win-x64,linux-x64,osx-arm64}.zip（内置 Web 管理面板）
#   · 移动端  AgoraIn-Android.apk/.aab；AgoraIn-iOS-simulator.zip（免签名）
#
# 签名：iOS / macOS 产物默认不签名，仅供内部测试；正式分发需配置证书。
# ═══════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [v4.0]
    tags: ['v4*']
    paths:
      - 'v4/**'
      - '.github/workflows/v4-build.yml'
  pull_request:
    paths: ['v4/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ══════════════════════════════════════════════════════════════════
  # 1. 质量门禁：构建 + 单元测试（每次 push / PR 都跑）
  # ══════════════════════════════════════════════════════════════════
  test:
    name: 质量门禁（build + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      - name: 还原
        run: dotnet restore v4/AgoraIn.sln

      - name: 构建（Debug，零警告要求）
        run: dotnet build v4/AgoraIn.sln -c Debug --no-restore

      - name: 单元测试
        run: dotnet test v4/AgoraIn.sln --no-build -c Debug

      # 仅在失败时留证，保留 1 天，避免占用产物配额
      - name: 保存测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ github.run_number }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # 2. Web 管理面板（Vue 3 → 静态产物）
  #    产物仅用于传递给服务端作业（体积很小，约 1MB）
  # ══════════════════════════════════════════════════════════════════
  webadmin:
    name: Web 管理面板
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4/src/AgoraIn.WebAdmin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v4/src/AgoraIn.WebAdmin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（含 vue-tsc 类型检查）
        run: npm run build

      # 仅完整构建需要交给服务端打包；push 时跳过以省配额
      - name: 上传产物（仅 tag / 手动触发）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: webadmin-dist
          path: v4/src/AgoraIn.WebAdmin/dist
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # 3. 桌面端（Avalonia）：Windows / Linux / macOS —— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  desktop:
    name: 桌面端 ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-latest, rid: win-x64 }
          - { name: linux-x64,   os: ubuntu-latest,  rid: linux-x64 }
          - { name: linux-arm64, os: ubuntu-latest,  rid: linux-arm64 }
          - { name: osx-x64,     os: macos-latest,   rid: osx-x64 }
          - { name: osx-arm64,   os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      # 自包含发布；关闭符号文件可显著减小体积（省产物配额）
      - name: 发布（自包含，不含调试符号）
        shell: bash
        run: |
          dotnet publish v4/src/AgoraIn.App/AgoraIn.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishReadyToRun=false \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/desktop

      # 冒烟自测：验证发布产物可运行（GUI 子系统自测在 Linux/macOS 无控制台）
      - name: 冒烟自测
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & publish/desktop/AgoraIn.exe --selftest --out publish/selftest-report.txt
          if ($LASTEXITCODE -ne 0) { throw "自测失败（退出码 $LASTEXITCODE）" }
          Get-Content publish/selftest-report.txt

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/desktop/* -DestinationPath publish/AgoraIn-${{ matrix.name }}.zip

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/desktop/AgoraIn
          (cd publish && zip -r -q "AgoraIn-${{ matrix.name }}.zip" desktop)

      - name: 上传产物（保留 3 天）
        uses: actions/upload-artifact@v4
        with:
          name: AgoraIn-${{ matrix.name }}
          path: publish/AgoraIn-${{ matrix.name }}.zip
          retention-days: 3

      # 打 tag 时直接附到 Release（Release 资源不计入 Actions 产物配额）
      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AgoraIn-${{ matrix.name }}.zip
          fail_on_unmatched_files: true

  # ══════════════════════════════════════════════════════════════════
  # 4. 服务端（ASP.NET Core，内置 Web 管理面板）—— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  server:
    name: 服务端 ${{ matrix.name }}
    needs: [test, webadmin]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,   os: windows-latest, rid: win-x64 }
          - { name: linux-x64, os: ubuntu-latest,  rid: linux-x64 }
          - { name: osx-arm64, os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: v4/**/*.csproj

      # 把 Web 管理面板产物放进 wwwroot，随服务端一起分发
      - name: 下载 Web 管理面板
        uses: actions/download-artifact@v4
        with:
          name: webadmin-dist
          path: v4/src/AgoraIn.Server/wwwroot

      - name: 发布（自包含，不含调试符号）
        shell: bash
        run: |
          dotnet publish v4/src/AgoraIn.Server/AgoraIn.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishReadyToRun=false \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/server

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/server/* -DestinationPath publish/AgoraIn-Server-${{ matrix.name }}.zip

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x publish/server/AgoraIn.Server
          (cd publish && zip -r -q "AgoraIn-Server-${{ matrix.name }}.zip" server)

      - name: 上传产物（保留 3 天）
        uses: actions/upload-artifact@v4
        with:
          name: AgoraIn-Server-${{ matrix.name }}
          path: publish/AgoraIn-Server-${{ matrix.name }}.zip
          retention-days: 3

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AgoraIn-Server-${{ matrix.name }}.zip
          fail_on_unmatched_files: true

  # ══════════════════════════════════════════════════════════════════
  # 5. 移动端 Android（MAUI）—— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  android:
    name: 移动端 Android
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 MAUI Android 工作负载
        run: dotnet workload install maui-android

      - name: 发布 APK
        run: |
          dotnet publish v4/src/AgoraIn.Mobile/AgoraIn.Mobile.csproj \
            -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/android

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p publish/artifacts
          find publish/android -name "*.apk" -exec cp {} publish/artifacts/AgoraIn-Android.apk \;
          find publish/android -name "*.aab" -exec cp {} publish/artifacts/AgoraIn-Android.aab \;
          ls -lh publish/artifacts || true

      - name: 上传产物（保留 3 天）
        uses: actions/upload-artifact@v4
        with:
          name: AgoraIn-Android
          path: publish/artifacts/*
          if-no-files-found: warn
          retention-days: 3

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/artifacts/AgoraIn-Android.*
          fail_on_unmatched_files: false

  # ══════════════════════════════════════════════════════════════════
  # 6. 移动端 iOS（MAUI，模拟器构建免签名）—— 仅 tag / 手动触发
  # ══════════════════════════════════════════════════════════════════
  ios:
    name: 移动端 iOS（模拟器）
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      # 模拟器构建无需证书；真机/分发构建需配置 Apple 证书与 Provisioning Profile
      - name: 编译（iossimulator-arm64，免签名）
        run: |
          dotnet build v4/src/AgoraIn.Mobile/AgoraIn.Mobile.csproj \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:DebugType=none -p:DebugSymbols=false \
            -o publish/ios

      - name: 打包 .app
        shell: bash
        run: |
          mkdir -p publish/artifacts
          APP=$(find publish/ios -maxdepth 4 -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            (cd "$(dirname "$APP")" && zip -r -q "$GITHUB_WORKSPACE/publish/artifacts/AgoraIn-iOS-simulator.zip" "$(basename "$APP")")
            echo "已打包：$APP"
          else
            echo "未找到 .app 产物（iOS 构建可能需要签名配置）"
            exit 1
          fi

      - name: 上传产物（保留 3 天）
        uses: actions/upload-artifact@v4
        with:
          name: AgoraIn-iOS
          path: publish/artifacts/*
          retention-days: 3

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/artifacts/AgoraIn-iOS-simulator.zip
          fail_on_unmatched_files: false
